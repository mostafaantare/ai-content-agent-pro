services:
  - type: web
    name: ai-content-agent-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_TOKEN
        generateValue: true
  - type: web
    name: ai-content-agent-pwa
    runtime: static
    buildCommand: "echo static files ready"
    staticPublishPath: ./web
