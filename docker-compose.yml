services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
  api:
    build: .
    restart: unless-stopped
    command: ["npm","start"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["8080:8080"]
    depends_on: [redis]
  worker:
    build: .
    restart: unless-stopped
    command: ["npm","run","worker"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on: [redis]
volumes:
  redis_data:
